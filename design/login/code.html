<p class="font-body-md text-body-md text-on-surface-variant">Gestiona tus redes y genera contenido audiovisual desde tu panel de control</p>
</div>

            </button>

</div>
<!-- Single-Sign-On Entry -->

<button class="w-full flex items-center justify-center gap-space-sm py-2.5 px-space-md bg-surface-container-lowest hover:bg-surface-container-low text-on-surface rounded-lg shadow-sm font-label-md text-label-md transition-colors" type="button">

</div>

</div>

</div>
<script>
  let currentAuthMode = 'login';

  function switchAuthMode(mode) {
    currentAuthMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const fieldName = document.getElementById('field-name');
    const linkForgot = document.getElementById('link-forgot');
    const labelRemember = document.getElementById('label-remember');
    const btnSubmit = document.getElementById('btn-submit');

    if (mode === 'login') {
      tabLogin.className = 'flex-1 py-2 text-center rounded-lg font-label-md text-label-md bg-surface-container-lowest text-on-surface shadow-sm transition-all';
      tabRegister.className = 'flex-1 py-2 text-center rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all';
      
      fieldName.classList.add('hidden');
      fieldName.classList.remove('flex');
      linkForgot.classList.remove('hidden');
      labelRemember.textContent = 'Mantener la sesión iniciada en este equipo';
      btnSubmit.textContent = 'Entrar a la plataforma';
    } else {
      tabRegister.className = 'flex-1 py-2 text-center rounded-lg font-label-md text-label-md bg-surface-container-lowest text-on-surface shadow-sm transition-all';
      tabLogin.className = 'flex-1 py-2 text-center rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all';
      
      fieldName.classList.remove('hidden');
      fieldName.classList.add('flex');
      linkForgot.classList.add('hidden');
      labelRemember.textContent = 'Acepto los términos de servicio y la política de privacidad';
      btnSubmit.textContent = 'Crear cuenta corporativa';
    }
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('input-password');
    const icon = document.getElementById('password-toggle-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>
