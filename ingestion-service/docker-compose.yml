services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ingesta
      POSTGRES_PASSWORD: ingesta
      POSTGRES_DB: ingesta
    volumes:
      - pgdata:/var/lib/postgresql/data
    # El healthcheck es lo que evita la carrera del Paso 0.5: `init_db()` hace
    # `CREATE EXTENSION vector` al arrancar, y contra un Postgres que aún está
    # inicializando ese comando falla y tumba la api.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingesta -d ingesta"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Margen para la inicialización del volumen en el primer arranque en frío.
      start_period: 15s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8001:8000"   # host 8001; el contenedor sigue en 8000 (backend principal usa 8000)
    environment:
      # Cache de modelos en el bind mount de storage, no dentro del contenedor:
      # sin esto, cada `docker compose up --build` vuelve a descargar 1-3 GB.
      HF_HOME: /storage/modelos
    volumes:
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    # 1 proceso y 2 hilos: en una VPS sin GPU conviene limitar la concurrencia
    command: dramatiq app.tasks --processes 1 --threads 2 --queues ingesta
    env_file: .env
    environment:
      # Quien carga el modelo es el worker, pero se fija en los dos para que un
      # movimiento de la transcripción a la api no vuelva a tirar la cache.
      HF_HOME: /storage/modelos
    volumes:
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
