services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ingesta
      POSTGRES_PASSWORD: ingesta
      POSTGRES_DB: ingesta
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/storage
    depends_on: [postgres, redis]

  worker:
    build: .
    # 1 proceso y 2 hilos: en una VPS sin GPU conviene limitar la concurrencia
    command: dramatiq app.tasks --processes 1 --threads 2 --queues ingesta
    env_file: .env
    volumes:
      - ./storage:/storage
    depends_on: [postgres, redis]

volumes:
  pgdata:
