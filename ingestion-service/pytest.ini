[pytest]
# Configuración para correr la suite desde el repo:
#
#   pip install -r requirements-dev.txt && python -m pytest
#
# Dentro del contenedor (que es donde están ffmpeg y Postgres) el comando es el
# del README del servicio, que monta `tests/` y `requirements-dev.txt` pero no
# este fichero: por eso los tests async llevan `@pytest.mark.asyncio` en vez de
# depender de `asyncio_mode`, y así funcionan con y sin él.
testpaths = tests

asyncio_mode = strict
# Sin esto pytest-asyncio avisa de que el scope por defecto puede cambiar.
asyncio_default_fixture_loop_scope = function

# `app.tasks` loguea de verdad (incluido `log.exception` cuando un clip no se
# puede medir). Con `log_cli` apagado, pytest enseña esas líneas solo si el test
# falla: run verde y silencioso, run rojo con el porqué.
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
